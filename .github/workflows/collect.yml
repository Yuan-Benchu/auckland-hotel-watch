name: collect

# 每 15 分钟采集一轮。跑在 GitHub 的机器上, 与用户的电脑无关 ——
# 这正是本仓库存在的理由: 本地采集在关机/待机时必然停摆。
on:
  schedule:
    # 每 15 分钟一轮。仓库为公开仓库, Actions 分钟数不限, 无需额度守门。
    #
    # 用 7,22,37,52 而不是 0,15,30,45: 官方文档说 schedule 在高负载时会
    # 被延迟, 负载高峰包括"每小时的开头", 且负载足够高时排队任务会被直接
    # 丢弃, 并建议避开整点。实测 2026-09-17 那段 cron "5,35": 6h43m 内
    # 本该触发 13 次, 实际只到了 2 次, 另外 11 次无记录无报错 —— 丢弃,
    # 不是延迟(送达的两次分别晚 44 秒和 7.5 分钟)。
    # 提到 4 次/小时既是按需要提频, 也让丢弃率有足够样本可测。
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:          # 允许手动触发, 用于验证

permissions:
  contents: write             # 需要把数据提交回仓库

concurrency:
  group: collect
  cancel-in-progress: false   # 采集不可并发, 但也别取消正在跑的那轮

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8        # 卡住就杀掉, 免得空烧免费额度
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 采集
        env:
          DIDA_KEY: ${{ secrets.DIDA_KEY }}
        run: python collect.py

      - name: 提交数据
        run: |
          git config user.name  "auckland-hotel-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 必须先 add 再比 —— git diff 对未跟踪的新文件是看不见的,
          # 首轮 rates.csv 还没被跟踪, 用 git diff 判断会误判成"无变化"。
          git add data/
          if git diff --cached --quiet; then
            echo "本轮无新增, 不提交"
            exit 0
          fi
          git commit -m "采集 $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 并发轮次之间可能撞车, 先 rebase 再推
          git pull --rebase --autostash origin main
          git push
