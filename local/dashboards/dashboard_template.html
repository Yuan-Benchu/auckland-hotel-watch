<title>奥克兰房价盯盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root {
  color-scheme: light;
  --ground:    #f1f4f6;
  --surface:   #ffffff;
  --surface-2: #e7ecef;
  --line:      #d3dbe0;
  --line-soft: #e6ebee;
  --ink:       #101619;
  --ink-2:     #56646e;
  --ink-3:     #8494a0;
  --queen:     #2a78d6;
  --city:      #eb6834;
  --good:      #0a7d32;
  --good-bg:   #e4f3e8;
  --band:      #eceff2;
  --warn:      #b06a00;
  --warn-bg:   #fdf3e3;
  --shadow:    0 1px 2px rgba(16,22,25,.05), 0 8px 24px -12px rgba(16,22,25,.14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:    #0f1316;
    --surface:   #181e22;
    --surface-2: #212a30;
    --line:      #2c363d;
    --line-soft: #232c32;
    --ink:       #eef3f5;
    --ink-2:     #9dabb5;
    --ink-3:     #6d7c87;
    --queen:     #3987e5;
    --city:      #d95926;
    --good:      #4ab963;
    --good-bg:   #17301f;
    --band:      #1d2428;
    --warn:      #e0a253;
    --warn-bg:   #2b2214;
    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:    #0f1316;
  --surface:   #181e22;
  --surface-2: #212a30;
  --line:      #2c363d;
  --line-soft: #232c32;
  --ink:       #eef3f5;
  --ink-2:     #9dabb5;
  --ink-3:     #6d7c87;
  --queen:     #3987e5;
  --city:      #d95926;
  --good:      #4ab963;
  --good-bg:   #17301f;
  --band:      #1d2428;
  --warn:      #e0a253;
  --warn-bg:   #2b2214;
  --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: "IBM Plex Sans", -apple-system, "Segoe UI", "Microsoft YaHei",
               "PingFang SC", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-block: 40px 64px;
  padding-left: 20px;
  padding-right: 20px;
  display: flex;
  flex-direction: column;
  gap: 34px;
}

h1, h2, h3 { font-family: "Archivo", "Microsoft YaHei", "PingFang SC", sans-serif;
             margin: 0; text-wrap: balance; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }

.num { font-family: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
       font-variant-numeric: tabular-nums; }

.eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3);
}

/* ---------- header ---------- */
header { display: flex; flex-direction: column; gap: 10px; }
.meta {
  display: flex; flex-wrap: wrap; gap: 6px 18px;
  font-size: 13px; color: var(--ink-2);
}
.meta b { font-weight: 500; color: var(--ink); }

/* ---------- panels ---------- */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px 22px;
}
.panel > header { margin-bottom: 16px; gap: 3px; }
.panel .sub { font-size: 13px; color: var(--ink-2); }

/* ---------- hotel cards ---------- */
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px;
  display: flex; flex-direction: column; gap: 14px;
  border-top: 3px solid var(--accent);
}
.card .name { font-family: "Archivo", sans-serif; font-weight: 600; font-size: 16px; }
.card .hero { display: flex; align-items: baseline; gap: 8px; }
.card .hero .v { font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
.card .hero .u { font-size: 13px; color: var(--ink-2); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .k { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
.stat .v { font-size: 15px; font-weight: 500; }

/* ---------- finding ---------- */
.finding {
  background: var(--surface-2);
  border-radius: 10px;
  padding: 18px 22px;
  display: flex; flex-direction: column; gap: 6px;
}
.finding p { margin: 0; font-size: 14.5px; color: var(--ink-2); max-width: 68ch; }
.finding strong { color: var(--ink); font-weight: 600; }

/* ---------- chart ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
          font-size: 13px; color: var(--ink-2); }
.legend button {
  display: inline-flex; align-items: center; gap: 7px;
  background: none; border: 0; padding: 3px 2px; cursor: pointer;
  font: inherit; color: var(--ink-2); border-radius: 4px;
}
.legend button[aria-pressed="false"] { opacity: .38; }
.legend button:focus-visible { outline: 2px solid var(--queen); outline-offset: 2px; }
.swatch { width: 11px; height: 11px; border-radius: 3px; background: var(--c); flex: none; }
.legend .note { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-3); }
.swatch.band { background: var(--band); border: 1px solid var(--line); }

.chartbox { position: relative; margin-top: 4px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
.gridline { stroke: var(--line-soft); stroke-width: 1; }
.axis-txt { fill: var(--ink-3); font-family: "IBM Plex Mono", monospace;
            font-size: 11px; font-variant-numeric: tabular-nums; }
.thresh { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 4 4; opacity: .85; }
.thresh-txt { fill: var(--good); font-family: "IBM Plex Mono", monospace;
              font-size: 11px; font-weight: 500; }
.series-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.dot-good { stroke: var(--surface); stroke-width: 2; }
.crosshair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.hit { fill: transparent; cursor: crosshair; }
.endlabel { font-family: "Archivo", sans-serif; font-size: 12px; font-weight: 600; }
.outlier-txt { fill: var(--ink-2); font-family: "IBM Plex Mono", monospace; font-size: 10.5px; }

.tip {
  position: absolute; pointer-events: none; z-index: 5;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: var(--shadow);
  padding: 10px 12px; min-width: 186px;
  font-size: 12.5px; opacity: 0; transition: opacity .1s;
}
.tip.on { opacity: 1; }
.tip .d { font-weight: 600; margin-bottom: 7px; font-family: "Archivo", sans-serif; }
.tip .d span { color: var(--ink-3); font-weight: 500; }
.tip .grp + .grp { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
.tip .h { display: flex; align-items: center; gap: 6px; font-weight: 500; margin-bottom: 3px; }
.tip .h i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; color: var(--ink-2); }
.tip .row.best { color: var(--ink); font-weight: 500; }
.tip .row.best .p { color: var(--good); }

/* ---------- provider ---------- */
.caveat {
  margin-top: 10px; padding: 9px 12px; border-radius: 7px;
  background: var(--warn-bg); border-left: 3px solid var(--warn);
  font-size: 12.5px; color: var(--ink-2); line-height: 1.5;
}
.caveat b { color: var(--ink); font-weight: 600; }
.prov { display: flex; flex-direction: column; gap: 2px; }
.prov-head, .prov-row {
  display: grid; grid-template-columns: 116px 1fr 58px 1fr 62px;
  gap: 12px; align-items: center;
}
.prov-head { font-size: 11px; color: var(--ink-3); letter-spacing: .04em;
             padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.prov-row { padding: 7px 0; }
.prov-row + .prov-row { border-top: 1px solid var(--line-soft); }
.prov-name { font-weight: 500; font-size: 13.5px; }
.bar { height: 9px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--f); }
.prov-v { font-size: 13px; text-align: right; color: var(--ink-2); }
.prov-v.strong { color: var(--ink); font-weight: 500; }

/* ---------- table ---------- */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 560px; }
th, td { text-align: left; padding: 7px 10px; white-space: nowrap; }
thead th {
  font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: .04em;
  border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface);
}
tbody tr + tr td { border-top: 1px solid var(--line-soft); }
tbody tr.we td { background: var(--band); }
td.p { text-align: right; }
td.p b { font-weight: 500; }
.pill {
  display: inline-block; padding: 1px 6px; border-radius: 4px;
  background: var(--good-bg); color: var(--good); font-weight: 500; font-size: 12px;
}
.prov-cell { color: var(--ink-2); font-size: 12.5px; }

footer { font-size: 12.5px; color: var(--ink-3); }
footer code { font-family: "IBM Plex Mono", monospace; font-size: 12px;
              background: var(--surface-2); padding: 1px 5px; border-radius: 3px; }

@media (max-width: 720px) {
  h1 { font-size: 24px; }
  .cards { grid-template-columns: 1fr; }
  .prov-head, .prov-row { grid-template-columns: 92px 1fr 50px; }
  .prov-head span:nth-child(4), .prov-head span:nth-child(5),
  .prov-row > :nth-child(4), .prov-row > :nth-child(5) { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">

  <header>
    <div class="eyebrow">Google Travel · NZD · 每晚最低价</div>
    <h1>奥克兰房价盯盘</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="cards" id="cards"></div>

  <div class="finding">
    <div class="eyebrow">最该记住的一件事</div>
    <p id="finding"></p>
  </div>

  <section class="panel">
    <header>
      <h2>每晚最低价 · 按入住日</h2>
      <div class="sub">两家酒店在各渠道中的最低报价。鼠标划过任意一天可看该日全部渠道的报价。</div>
    </header>
    <div class="legend" id="legend"></div>
    <div class="chartbox">
      <svg id="chart" viewBox="0 0 1000 400" role="img" aria-label="两家酒店每晚最低价随入住日期变化的折线图"></svg>
      <div class="tip" id="tip" role="tooltip"></div>
    </div>
  </section>

  <section class="panel">
    <header>
      <h2>渠道表现</h2>
      <div class="sub">在 <span id="combos"></span> 个（酒店 × 入住日）组合里，每个渠道多常是最便宜的那个，以及它平均比当日最低价贵多少。</div>
      <div class="caveat" id="caveat"></div>
    </header>
    <div class="prov" id="prov"></div>
  </section>

  <section class="panel">
    <header>
      <h2>全部 63 晚明细</h2>
      <div class="sub">灰底为周五至周日。<span class="pill">绿色</span>表示低于 NZ$100。</div>
    </header>
    <div class="tablewrap">
      <table id="tbl">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/;

const THRESHOLD = 100;
const NBSP = " ";
const COLORS = ["var(--queen)", "var(--city)"];
const fmt = n => "NZ$" + n;
const md = s => { const [, m, d] = s.split("-"); return +m + "/" + +d; };

/* ---------------- header meta ---------------- */
const S = DATA.summary;
const byHotel = Object.fromEntries(DATA.series.map(s => [s.hotel, s]));
document.getElementById("meta").innerHTML = [
  `<b>${S[0].days}</b> 晚`,
  `<b>${DATA.hotels.length}</b> 家酒店`,
  `<b>${DATA.providers.length}</b> 个渠道`,
  `<b>${DATA.rows}</b> 条报价`,
  `抓取于 <b>${DATA.span[0].slice(5, 16)}</b> – <b>${DATA.span[1].slice(11, 16)}</b>`
].map(t => `<span>${t}</span>`).join("");

/* ---------------- hotel cards ---------------- */
document.getElementById("cards").innerHTML = S.map((s, i) => {
  const gap = s.weekend_median - s.weekday_median;
  const cheap = byHotel[s.hotel].points.find(p => p.checkin === s.cheapest_date);
  return `<article class="card" style="--accent:${COLORS[i]}">
    <div class="name">${s.hotel}</div>
    <div class="hero">
      <span class="v num">${fmt(s.min)}</span>
      <span class="u">最低 · ${md(s.cheapest_date)} 周${cheap.weekday} · ${s.cheapest_provider}</span>
    </div>
    <div class="stats">
      <div class="stat"><span class="k">中位价</span><span class="v num">${fmt(s.median)}</span></div>
      <div class="stat"><span class="k">价格区间</span><span class="v num">${fmt(s.min)}–${s.max}</span></div>
      <div class="stat"><span class="k">平日中位</span><span class="v num">${fmt(s.weekday_median)}</span></div>
      <div class="stat"><span class="k">周末溢价</span><span class="v num">+${fmt(gap).slice(3)}<span style="color:var(--ink-3);font-size:12px"> (${Math.round(gap / s.weekday_median * 100)}%)</span></span></div>
    </div>
  </article>`;
}).join("");

/* ---------------- headline finding ---------------- */
const worst = DATA.provider_summary.reduce((a, b) =>
  (b.appear >= 100 && b.wins < a.wins) ? b : a);
const best = DATA.provider_summary[0];
const allPts = DATA.series.flatMap(s => s.points);
const combos = allPts.length;
const under = allPts.filter(p => p.min_price < THRESHOLD).length;
const rateKing = DATA.provider_summary
  .filter(p => p.appear >= combos * 0.15)
  .reduce((a, b) => (b.wins / b.appear > a.wins / a.appear) ? b : a);
document.getElementById("finding").innerHTML =
  `<strong>${worst.provider} 出现了 ${worst.appear} 次，只有 ${worst.wins} 次是最便宜的</strong>，` +
  `平均比当日最低价贵 <strong>${worst.avg_premium}%</strong>。` +
  `最常胜出的是 <strong>${best.provider}</strong>（${best.wins}/${best.appear} 次），` +
  `命中率最高的是 <strong>${rateKing.provider}</strong>` +
  `（出现 ${rateKing.appear} 次赢 ${rateKing.wins} 次，${Math.round(rateKing.wins / rateKing.appear * 100)}%）。` +
  `${combos} 个组合里有 <strong>${under} 个</strong>能订到 NZ$${THRESHOLD} 以下。`;
document.getElementById("combos").textContent = combos;

/* ---------------- chart ---------------- */
const W = 1000, H = 400, PL = 52, PR = 54, PT = 18, PB = 40;
const IW = W - PL - PR, IH = H - PT - PB;
const Y0 = 60, Y1 = 280;                 // 唯一的离群点(NZ$468)单独标注, 不压扁其余曲线
const pts = DATA.series[0].points;
const N = pts.length;
const x = i => PL + (N === 1 ? IW / 2 : IW * i / (N - 1));
const y = v => PT + IH * (1 - (Math.min(v, Y1) - Y0) / (Y1 - Y0));

const on = DATA.series.map(() => true);
const svg = document.getElementById("chart");
const tip = document.getElementById("tip");

document.getElementById("legend").innerHTML =
  DATA.series.map((s, i) =>
    `<button type="button" data-i="${i}" aria-pressed="true" style="--c:${COLORS[i]}">
       <span class="swatch"></span>${s.hotel}</button>`).join("") +
  `<span class="note"><span class="swatch band"></span>周五–周日</span>` +
  `<span class="note" style="color:var(--good)">┈ NZ$${THRESHOLD} 线</span>`;

function draw() {
  let h = "";

  // 周末底纹
  pts.forEach((p, i) => {
    if (!p.is_weekend) return;
    const a = i === 0 ? x(0) : (x(i - 1) + x(i)) / 2;
    const b = i === N - 1 ? x(N - 1) : (x(i) + x(i + 1)) / 2;
    h += `<rect x="${a.toFixed(1)}" y="${PT}" width="${(b - a).toFixed(1)}" height="${IH}" fill="var(--band)"/>`;
  });

  // y 轴
  for (let v = Y0 + 20; v <= Y1; v += 40) {
    h += `<line class="gridline" x1="${PL}" y1="${y(v)}" x2="${PL + IW}" y2="${y(v)}"/>`;
    h += `<text class="axis-txt" x="${PL - 10}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  h += `<text class="axis-txt" x="${PL - 10}" y="${PT - 4}" text-anchor="end">NZ$</text>`;

  // 阈值线
  h += `<line class="thresh" x1="${PL}" y1="${y(THRESHOLD)}" x2="${PL + IW}" y2="${y(THRESHOLD)}"/>`;
  h += `<text class="thresh-txt" x="${PL + IW + 6}" y="${y(THRESHOLD) + 4}">${THRESHOLD}</text>`;

  // x 轴
  pts.forEach((p, i) => {
    if (i % 7 && i !== N - 1) return;
    h += `<line class="gridline" x1="${x(i)}" y1="${PT + IH}" x2="${x(i)}" y2="${PT + IH + 5}"/>`;
    h += `<text class="axis-txt" x="${x(i)}" y="${PT + IH + 19}" text-anchor="middle">${md(p.checkin)}</text>`;
    h += `<text class="axis-txt" x="${x(i)}" y="${PT + IH + 32}" text-anchor="middle" opacity=".7">周${p.weekday}</text>`;
  });
  h += `<line class="gridline" x1="${PL}" y1="${PT + IH}" x2="${PL + IW}" y2="${PT + IH}"/>`;

  // 折线
  DATA.series.forEach((s, si) => {
    if (!on[si]) return;
    const d = s.points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.min_price).toFixed(1)).join(" ");
    h += `<path class="series-line" d="${d}" stroke="${COLORS[si]}"/>`;
    // 低于阈值的点直接标出来
    s.points.forEach((p, i) => {
      if (p.min_price < THRESHOLD)
        h += `<circle class="dot-good" cx="${x(i).toFixed(1)}" cy="${y(p.min_price).toFixed(1)}" r="3.6" fill="${COLORS[si]}"/>`;
      if (p.min_price > Y1) {
        h += `<path d="M${x(i).toFixed(1)} ${PT - 2} l4.5 7 h-9 z" fill="${COLORS[si]}"/>`;
        h += `<text class="outlier-txt" x="${x(i).toFixed(1)}" y="${PT + 18}" text-anchor="middle">${fmt(p.min_price)}</text>`;
      }
    });
    // 直接标注series名, 不只靠颜色
    const last = s.points[N - 1];
    h += `<text class="endlabel" x="${PL + IW + 6}" y="${y(last.min_price) + 4}" fill="${COLORS[si]}">${si ? "City" : "Queen"}</text>`;
  });

  h += `<line class="crosshair" id="ch" x1="0" y1="${PT}" x2="0" y2="${PT + IH}" style="display:none"/>`;
  h += `<rect class="hit" id="hit" x="${PL}" y="${PT}" width="${IW}" height="${IH}"/>`;
  svg.innerHTML = h;
  bindHover();
}

function bindHover() {
  const hit = svg.querySelector("#hit"), ch = svg.querySelector("#ch");
  const move = e => {
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * W;
    let i = Math.round((px - PL) / (IW / (N - 1)));
    i = Math.max(0, Math.min(N - 1, i));
    ch.style.display = "";
    ch.setAttribute("x1", x(i)); ch.setAttribute("x2", x(i));

    const p0 = pts[i];
    let html = `<div class="d">${p0.checkin} <span>周${p0.weekday}</span></div>`;
    DATA.series.forEach((s, si) => {
      if (!on[si]) return;
      const p = s.points[i];
      const rows = Object.entries(p.offers).sort((a, b) => a[1] - b[1]);
      html += `<div class="grp"><div class="h" style="--c:${COLORS[si]}"><i></i>${s.hotel}</div>` +
        rows.map(([k, v], j) =>
          `<div class="row${j ? "" : " best"}"><span>${k}</span><span class="num p">${fmt(v)}</span></div>`
        ).join("") + `</div>`;
    });
    tip.innerHTML = html;
    tip.classList.add("on");
    const cw = svg.getBoundingClientRect().width;
    const left = x(i) / W * cw;
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(4, Math.min(cw - tw - 4, left + 14)) + "px";
    tip.style.top = "6px";
  };
  hit.addEventListener("mousemove", move);
  hit.addEventListener("mouseleave", () => {
    tip.classList.remove("on");
    svg.querySelector("#ch").style.display = "none";
  });
}

document.getElementById("legend").addEventListener("click", e => {
  const b = e.target.closest("button[data-i]");
  if (!b) return;
  const i = +b.dataset.i;
  if (on.filter(Boolean).length === 1 && on[i]) return;   // 至少留一条
  on[i] = !on[i];
  b.setAttribute("aria-pressed", String(on[i]));
  draw();
});

draw();

/* ---------------- provider ---------------- */
const avgProv = allPts.reduce((a, p) => a + p.n_providers, 0) / allPts.length;
document.getElementById("caveat").innerHTML = avgProv < 3
  ? `<b>渠道覆盖不完整：平均每个组合只抓到 ${avgProv.toFixed(1)} 个渠道。</b>
     Google 页面把 Booking.com、Hotels.com 等放在「Sponsored·Featured options」广告位，
     渲染比官网/Super.com 所在的「All options」晚，抓取时常常还没加载出来。
     丢掉的基本都是<b>更贵</b>的渠道，所以上面的最低价可信；
     但本表的「胜出次数」只反映抓到的这 ${DATA.providers.length} 个渠道之间的比较，不是全网比价。`
  : `平均每个组合抓到 ${avgProv.toFixed(1)} 个渠道。`;

const maxPrem = Math.max(...DATA.provider_summary.map(p => p.avg_premium));
document.getElementById("prov").innerHTML =
  `<div class="prov-head"><span>渠道</span><span>最便宜的比例</span><span style="text-align:right">胜出</span><span>平均溢价</span><span style="text-align:right">高于最低价</span></div>` +
  DATA.provider_summary.map(p => {
    const rate = p.wins / p.appear * 100;
    return `<div class="prov-row">
      <span class="prov-name">${p.provider}</span>
      <span class="bar" style="--f:var(--queen)"><i style="width:${rate.toFixed(1)}%"></i></span>
      <span class="prov-v strong num">${p.wins}/${p.appear}</span>
      <span class="bar" style="--f:var(--city)"><i style="width:${(p.avg_premium / maxPrem * 100).toFixed(1)}%"></i></span>
      <span class="prov-v num">+${p.avg_premium}%</span>
    </div>`;
  }).join("");

/* ---------------- table ---------------- */
document.querySelector("#tbl thead").innerHTML =
  `<tr><th>入住日</th><th>周</th>` +
  DATA.series.map(s => `<th style="text-align:right">${s.hotel}</th><th>渠道</th>`).join("") +
  `</tr>`;
document.querySelector("#tbl tbody").innerHTML = pts.map((p0, i) => {
  const cells = DATA.series.map(s => {
    const p = s.points[i];
    const v = p.min_price < THRESHOLD
      ? `<span class="pill num">${fmt(p.min_price)}</span>`
      : `<b class="num">${fmt(p.min_price)}</b>`;
    return `<td class="p">${v}</td><td class="prov-cell">${p.min_provider}</td>`;
  }).join("");
  return `<tr class="${p0.is_weekend ? "we" : ""}"><td class="num">${p0.checkin}</td>` +
         `<td>周${p0.weekday}</td>${cells}</tr>`;
}).join("");

/* ---------------- footer ---------------- */
document.getElementById("foot").innerHTML =
  `数据来自 Google Travel 聚合的各渠道报价，${DATA.rows} 条记录合并自 ` +
  `<code>hotel_prices.csv</code> 与 <code>hotel_prices_fast.csv</code>，` +
  `生成于 ${DATA.generated}。价格为 1 晚含税前报价，实际以渠道页面为准。`;
</script>
