<style>
  :root {
    --ground:      #f4f6f8;
    --panel:       #ffffff;
    --panel-sunk:  #eef1f5;
    --rule:        #dde2e8;
    --rule-strong: #c3ccd6;
    --ink:         #131920;
    --ink-2:       #566270;
    --ink-3:       #8492a1;
    --accent:      #2a78d6;
    --accent-soft: #e7f0fc;
    --good:        #1f7a4d;
    --warn:        #9a5b00;
    --crit:        #b0332f;
    --warn-soft:   #fdf2e0;
    --crit-soft:   #fbeceb;
    --good-soft:   #e6f3ec;

    /* 顺序色阶: 价格越高越深 (蓝, 单色) */
    --q1: #cde2fb; --q2: #9ec5f4; --q3: #86b6ef; --q4: #6da7ec;
    --q5: #3987e5; --q6: #256abf; --q7: #184f95; --q8: #0d366b;
    --q1-ink:#123; --q2-ink:#123; --q3-ink:#123; --q4-ink:#0b1d33;
    --q5-ink:#fff; --q6-ink:#fff; --q7-ink:#fff; --q8-ink:#fff;

    /* 分类色: 按文档给定的固定顺序取前 4 槽 (相邻配对下通过 CVD 闸门, 必须配直标) */
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s1-ink: #fff; --s2-ink: #fff; --s3-ink: #06231a; --s4-ink: #2a1c00;
    --dim: #aab4c0;

    --shadow: 0 1px 2px rgba(19,25,32,.05), 0 8px 24px -12px rgba(19,25,32,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #14171b;
      --panel:       #1b1f24;
      --panel-sunk:  #23282e;
      --rule:        #2e343b;
      --rule-strong: #414a54;
      --ink:         #eef2f6;
      --ink-2:       #a4b0bd;
      --ink-3:       #75828f;
      --accent:      #5d9bec;
      --accent-soft: #1d2b3e;
      --good:        #4cbb87;
      --warn:        #d79a3a;
      --crit:        #e8736e;
      --warn-soft:   #2e2617;
      --crit-soft:   #33201f;
      --good-soft:   #16291f;

      /* 深色底上顺序色阶反过来走亮度: 越贵越亮, 才拉得开跟底色的差 */
      --q1: #12325c; --q2: #17406f; --q3: #1d5087; --q4: #25639f;
      --q5: #3079bd; --q6: #4a91d5; --q7: #74afe6; --q8: #a6cdf4;
      --q1-ink:#dce9f8; --q2-ink:#e4eefb; --q3-ink:#eaf3fd; --q4-ink:#f2f8ff;
      --q5-ink:#08121e; --q6-ink:#08121e; --q7-ink:#08121e; --q8-ink:#08121e;

      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s1-ink: #06121e; --s2-ink: #fff; --s3-ink: #041a12; --s4-ink: #1d1300;
      --dim: #59636e;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --ground:      #14171b;
    --panel:       #1b1f24;
    --panel-sunk:  #23282e;
    --rule:        #2e343b;
    --rule-strong: #414a54;
    --ink:         #eef2f6;
    --ink-2:       #a4b0bd;
    --ink-3:       #75828f;
    --accent:      #5d9bec;
    --accent-soft: #1d2b3e;
    --good:        #4cbb87;
    --warn:        #d79a3a;
    --crit:        #e8736e;
    --warn-soft:   #2e2617;
    --crit-soft:   #33201f;
    --good-soft:   #16291f;
    --q1: #12325c; --q2: #17406f; --q3: #1d5087; --q4: #25639f;
    --q5: #3079bd; --q6: #4a91d5; --q7: #74afe6; --q8: #a6cdf4;
    --q1-ink:#dce9f8; --q2-ink:#e4eefb; --q3-ink:#eaf3fd; --q4-ink:#f2f8ff;
    --q5-ink:#08121e; --q6-ink:#08121e; --q7-ink:#08121e; --q8-ink:#08121e;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s1-ink: #06121e; --s2-ink: #fff; --s3-ink: #041a12; --s4-ink: #1d1300;
    --dim: #59636e;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 "Noto Sans CJK SC", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 0 72px; }

  /* ---------------------------------------------------------- 排版 */
  h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -.012em; }
  h1 { font-size: clamp(26px, 5vw, 38px); line-height: 1.15; }
  h2 { font-size: 19px; }
  h3 { font-size: 15px; }
  p  { margin: 0; }

  .num { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
         font-variant-numeric: tabular-nums; }

  .eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-3);
  }

  .lede { color: var(--ink-2); max-width: 64ch; }
  .fine { font-size: 13px; color: var(--ink-2); }
  .finer { font-size: 12px; color: var(--ink-3); }

  a { color: var(--accent); text-underline-offset: 2px; }
  a:focus-visible, button:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px;
  }

  /* ---------------------------------------------------------- 页头 */
  header.masthead { padding-block: 40px 28px; border-bottom: 1px solid var(--rule); }
  .masthead h1 { margin-top: 10px; }
  .masthead .lede { margin-top: 12px; }

  .provenance {
    margin-top: 20px; display: flex; flex-wrap: wrap; gap: 6px 22px;
    font-size: 12px; color: var(--ink-3);
  }
  .provenance b { color: var(--ink-2); font-weight: 500; }

  section { padding-block: 40px; border-bottom: 1px solid var(--rule); }
  section:last-of-type { border-bottom: 0; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 6px; }
  .sec-note { margin-bottom: 22px; }

  /* ---------------------------------------------------------- 结论卡 */
  .verdict {
    margin-top: 32px; background: var(--panel); border: 1px solid var(--rule);
    border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
  }
  .verdict-top {
    display: grid; grid-template-columns: minmax(0,1.35fr) minmax(0,1fr);
    gap: 28px; padding: 26px 26px 24px;
  }
  @media (max-width: 720px) { .verdict-top { grid-template-columns: 1fr; gap: 20px; } }

  .verdict h2 { font-size: 24px; margin-top: 8px; letter-spacing: -.02em; }
  .verdict .addr { margin-top: 6px; font-size: 13px; color: var(--ink-2); }
  .verdict .why { margin-top: 16px; font-size: 14px; color: var(--ink-2); }

  .bignum { display: flex; align-items: baseline; gap: 8px; }
  .bignum .cur { font-size: 17px; color: var(--ink-2); font-weight: 500; }
  .bignum .val { font-size: clamp(42px, 9vw, 58px); font-weight: 600; letter-spacing: -.03em; line-height: 1; }
  .bignum .unit { font-size: 14px; color: var(--ink-2); }

  .verdict-side { border-left: 1px solid var(--rule); padding-left: 28px; }
  @media (max-width: 720px) {
    .verdict-side { border-left: 0; border-top: 1px solid var(--rule); padding-left: 0; padding-top: 20px; }
  }
  .kv { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; font-size: 14px; }
  .kv + .kv { border-top: 1px dashed var(--rule); }
  .kv .k { color: var(--ink-2); }
  .kv .v { font-weight: 500; }

  .verdict-foot {
    background: var(--panel-sunk); border-top: 1px solid var(--rule);
    padding: 16px 26px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
    background: var(--accent); color: #fff; border-radius: 7px;
    padding: 9px 15px; font-size: 13.5px; font-weight: 500;
  }
  :root[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn { color: #08121e; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .btn { color: #fff; } }
  .btn:hover { filter: brightness(1.07); }

  /* ---------------------------------------------------------- 指标行 */
  .kpis {
    margin-top: 28px; display: grid; gap: 1px; background: var(--rule);
    border: 1px solid var(--rule); border-radius: 10px; overflow: hidden;
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .kpi { background: var(--panel); padding: 16px 18px 18px; }
  .kpi .k { font-size: 12px; color: var(--ink-2); }
  .kpi .v { margin-top: 5px; font-size: 25px; font-weight: 600; letter-spacing: -.02em; }
  .kpi .s { margin-top: 3px; font-size: 12px; color: var(--ink-3); }

  /* ---------------------------------------------------------- 热力图 */
  .scroller { overflow-x: auto; overscroll-behavior-x: contain; padding-bottom: 6px; }
  .heat { border-collapse: separate; border-spacing: 2px; min-width: 900px; }
  .heat th, .heat td { padding: 0; }
  .heat .rowlab {
    text-align: right; padding-right: 12px; font-size: 13px; white-space: nowrap;
    position: sticky; left: 0; background: var(--ground); z-index: 2;
  }
  .heat .rowlab .badge { display: inline-block; margin-left: 6px; }
  .heat .collab { font-size: 11px; font-weight: 500; color: var(--ink-2); line-height: 1.25; padding-bottom: 6px; }
  .heat .collab .dow { display: block; font-size: 10px; color: var(--ink-3); }
  .heat .collab.wknd .dow { color: var(--warn); }
  .heat .cell {
    width: 44px; height: 34px; border-radius: 4px; text-align: center;
    font-size: 12.5px; font-weight: 500; cursor: default;
  }
  .heat .cell.best { box-shadow: inset 0 0 0 2px var(--ink); }
  .heat .cell.thin::after {
    content: ""; position: absolute; inset: 0; border-radius: 4px;
    background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(255,255,255,.45) 4px 5px);
  }
  .heat td.c { position: relative; }
  .heat .out { opacity: .45; }
  .heat .sumcol { font-size: 12.5px; font-weight: 600; padding-left: 12px; white-space: nowrap; }
  .heat tr.hi .rowlab { color: var(--ink); font-weight: 600; }
  .heat .divider { width: 10px; }

  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 16px; font-size: 12px; color: var(--ink-2); }
  .ramp { display: flex; align-items: center; gap: 4px; }
  .ramp i { width: 22px; height: 11px; border-radius: 2px; display: block; }
  .key { display: inline-flex; align-items: center; gap: 6px; }
  .key .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid var(--rule-strong); }
  .key .sw.hatch { background: repeating-linear-gradient(135deg, var(--panel-sunk) 0 4px, var(--rule-strong) 4px 5px); }
  .key .sw.ring { background: transparent; box-shadow: inset 0 0 0 2px var(--ink); border: 0; }

  /* ---------------------------------------------------------- tooltip */
  #tip {
    position: fixed; z-index: 90; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--panel); color: var(--ink); border: 1px solid var(--rule-strong);
    border-radius: 8px; box-shadow: var(--shadow); padding: 11px 13px; font-size: 12.5px;
    max-width: 280px; line-height: 1.5;
  }
  #tip.on { opacity: 1; }
  #tip .t-h { font-weight: 600; margin-bottom: 2px; }
  #tip .t-d { color: var(--ink-3); font-size: 11.5px; margin-bottom: 7px; }
  #tip .t-row { display: flex; justify-content: space-between; gap: 14px; }
  #tip .t-row.top { font-weight: 600; }
  #tip .t-f { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--rule); color: var(--ink-3); font-size: 11.5px; }

  /* ---------------------------------------------------------- 折线 */
  .chartbox { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 16px 10px; }
  svg.line { display: block; width: 100%; height: auto; }
  svg.line text { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------- 方案 */
  .plans { display: flex; flex-direction: column; gap: 10px; }
  .plan {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 9px;
    padding: 14px 16px; display: grid; gap: 4px 18px;
    grid-template-columns: minmax(0,1fr) auto;
  }
  .plan.pick { border-color: var(--accent); background: var(--accent-soft); }
  .plan .pname { font-weight: 600; font-size: 14.5px; }
  .plan .ptot { text-align: right; font-weight: 600; font-size: 17px; white-space: nowrap; }
  .plan .pdelta { text-align: right; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .plan .track { grid-column: 1 / -1; display: flex; gap: 2px; margin-top: 8px; height: 26px; }
  .plan .seg {
    display: flex; align-items: center; justify-content: center; border-radius: 4px;
    font-size: 11px; font-weight: 500; white-space: nowrap; padding-inline: 4px; min-width: 0;
  }
  .plan .legs { grid-column: 1 / -1; margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
  .plan .legs div { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }

  /* ---------------------------------------------------------- 表格 */
  table.grid { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 620px; }
  table.grid th, table.grid td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--rule); }
  table.grid th { font-weight: 500; color: var(--ink-2); font-size: 12px; position: sticky; top: 0; background: var(--ground); }
  table.grid td:first-child, table.grid th:first-child { text-align: left; }
  table.grid tbody tr:hover { background: var(--panel-sunk); }

  .badge {
    display: inline-block; font-size: 10.5px; font-weight: 600; padding: 1px 6px;
    border-radius: 4px; letter-spacing: .02em; vertical-align: 1px;
  }
  .badge.ok   { background: var(--good-soft); color: var(--good); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad  { background: var(--crit-soft); color: var(--crit); }

  /* ---------------------------------------------------------- 注意事项 */
  .caveats { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0,1fr)); }
  @media (max-width: 760px) { .caveats { grid-template-columns: 1fr; } }
  .cav {
    background: var(--panel); border: 1px solid var(--rule); border-left: 3px solid var(--rule-strong);
    border-radius: 0 8px 8px 0; padding: 13px 15px;
  }
  .cav.stop { border-left-color: var(--crit); }
  .cav.check { border-left-color: var(--warn); }
  .cav.fyi { border-left-color: var(--accent); }
  .cav h3 { font-size: 13.5px; }
  .cav p { margin-top: 5px; font-size: 13px; color: var(--ink-2); }

  details.tablewrap { margin-top: 18px; }
  details.tablewrap summary { cursor: pointer; font-size: 13.5px; color: var(--accent); padding: 4px 0; }

  footer { padding-block: 28px 8px; font-size: 12px; color: var(--ink-3); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
const D = /*__DATA__*/{};

const NZ  = n => "NZ$" + Math.round(n).toLocaleString("en-NZ");
const NZ1 = n => "NZ$" + n.toFixed(1);
const md  = d => (+d.slice(5, 7)) + "/" + (+d.slice(8, 10));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* 短名: 表格和图例里用得下的长度 */
const SHORT = {
  "Ascotia Off Queen Auckland":          "Ascotia Off Queen",
  "ibis budget Auckland Central":        "ibis budget Central",
  "Albion Hotel Auckland":               "Albion",
  "Shakespeare Hotel Auckland":          "Shakespeare",
  "VR Queen Street Auckland":            "VR Queen Street",
  "Auckland City Hotel":                 "Auckland City Hotel",
  "VR Auckland City":                    "VR Auckland City",
  "The Quadrant Hotel & Suites Auckland":"Quadrant",
  "Copthorne Hotel Auckland City":       "Copthorne",
};
const short = h => SHORT[h] || h;

const ADDR = {
  "Ascotia Off Queen Auckland":   "5 Scotia Place, Auckland CBD",
  "ibis budget Auckland Central": "20 Wyndham Street, Auckland CBD",
  "Albion Hotel Auckland":        "119 Hobson Street, Auckland CBD",
  "Shakespeare Hotel Auckland":   "61 Albert Street, Auckland CBD",
};

/* 解析价跟页面头条价对不上的那几家, 由导出脚本判定, 不进推荐。 */
const UNTRUSTED = new Set(D.untrusted);

const nights = D.nights, dates = D.dates, hotels = D.hotels;
const lastNight = nights[nights.length - 1];
const cell = (h, d) => D.cells[h + "|" + d];
const price = (h, d) => D.grid[h][d];

/* ---------------------------------------------------------------- 色阶 */
const BREAKS = [70, 80, 90, 105, 125, 150, 200];   // 8 档
function qi(v) { let i = 0; while (i < BREAKS.length && v >= BREAKS[i]) i++; return i + 1; }

/* ---------------------------------------------------------------- 页头 */
const M = D.meta;
document.getElementById("h-lede").textContent =
  `${nights.length} 晚（${md(nights[0])} 入住，${md(M.checkout)} 退房）。` +
  `${hotels.length} 家 CBD 酒店，每晚取全渠道最低的可订价，` +
  `再算“全程不换”和“换店”各要多少钱。`;

document.getElementById("prov").innerHTML = [
  ["数据", `${M.snapshot}（Google 零售价）`],

    (c.n <= 2 ? `<br><b>只抓到 ${c.n} 个渠道，信心低</b>` : "") + `</div>`;
  tip.classList.add("on"); tip.setAttribute("aria-hidden", "false");

  if (x + tr.width > innerWidth - 8) x = innerWidth - tr.width - 8;
  if (y < 8) y = r.bottom + 8;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = y + "px";
}

/* ---------------------------------------------------------------- 折线 */
const FOCUS = ranked.slice(0, 3).map(([, h]) => h);
const SCOL = ["var(--s1)", "var(--s2)", "var(--s3)"];

/* 9 家当晚价格的中位数 —— 只作参照, 说明「整片一起动」还是「这家单独动」 */
const medianAt = d => {
  const v = hotels.map(h => price(h, d)).sort((a, b) => a - b);
  return v[(v.length - 1) >> 1];
};

(function drawLine() {
  /* 只画实际要住的 19 晚。退房日 10/9 全线冲到 NZ$300+, 放进来会把 y 轴拉到
     三条候选线全挤在底部 20% —— 那正是这张图唯一要看清的地方。10/9 留给
     热力图和下面那句话交代。 */
  const xs = nights;
  const W = 880, H = 320, L = 46, R = 96, T = 18, B = 42;
  const iw = W - L - R, ih = H - T - B;
  const series = FOCUS.map(h => xs.map(d => price(h, d)));
  const refs = xs.map(medianAt);
  const lo = Math.min(...series.flat(), ...refs), hi = Math.max(...series.flat(), ...refs);
  const step = 20;
  const ymin = Math.floor(lo / step) * step - step, ymax = Math.ceil(hi / step) * step;
  const X = i => L + i * iw / (xs.length - 1);
  const Y = v => T + ih - (v - ymin) / (ymax - ymin) * ih;
  const path = vals => vals.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" ");

  let s = "";
  for (let v = ymin; v <= ymax; v += step) {
    s += `<line x1="${L}" y1="${Y(v)}" x2="${L + iw}" y2="${Y(v)}" stroke="var(--rule)" stroke-width="1"/>` +
         `<text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--ink-3)">${v}</text>`;
  }
  // 尖峰日整列压一层底色, 让「那晚整片抬起来」自己看得见
  spike.forEach(d => {
    const i = xs.indexOf(d); if (i < 0) return;
    const half = iw / (xs.length - 1) / 2;
    s += `<rect x="${X(i) - half}" y="${T}" width="${half * 2}" height="${ih}" fill="var(--warn)" opacity=".1"/>` +
         `<text x="${X(i)}" y="${T + 11}" text-anchor="middle" font-size="9.5" fill="var(--warn)">整片涨价</text>`;
  });

  xs.forEach((d, i) => {
    if (i % 2) return;
    const wknd = D.weekday[d] === "六" || D.weekday[d] === "日";
    s += `<text x="${X(i)}" y="${H - B + 15}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${md(d)}</text>` +
         `<text x="${X(i)}" y="${H - B + 27}" text-anchor="middle" font-size="9" fill="${wknd ? "var(--warn)" : "var(--ink-3)"}">${D.weekday[d]}</text>`;
  });

  s += `<path d="${path(refs)}" fill="none" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round"/>`;
  series.forEach((vals, k) => {
    s += `<path d="${path(vals)}" fill="none" stroke="${SCOL[k]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` +
         `<circle cx="${X(xs.length - 1)}" cy="${Y(vals[vals.length - 1])}" r="4.5" fill="${SCOL[k]}" stroke="var(--panel)" stroke-width="2"/>`;
  });

  // 端点直标, 收敛时用引出线分开, 不直接挪文字
  const ends = FOCUS.map((h, k) => ({ h, k, y: Y(series[k][xs.length - 1]) })).sort((a, b) => a.y - b.y);
  let prev = -99;
  ends.forEach(e => {
    const y = Math.max(e.y, prev + 13); prev = y;
    s += `<line x1="${X(xs.length - 1) + 6}" y1="${e.y}" x2="${L + iw + 8}" y2="${y}" stroke="${SCOL[e.k]}" stroke-width="1" opacity=".55"/>` +
         `<text x="${L + iw + 12}" y="${y + 3.5}" font-size="10.5" fill="var(--ink-2)">${esc(short(e.h))}</text>`;
  });

  const sv = document.getElementById("linechart");
  sv.setAttribute("viewBox", `0 0 ${W} ${H}`);
  sv.insertAdjacentHTML("beforeend", s);
})();

document.getElementById("line-note").innerHTML =
