<style>

    /* 发散色阶(涨/跌): 蓝 <-> 红, 中点中性灰 */
    --dn3:#184f95; --dn2:#3987e5; --dn1:#9ec5f4;

  @media (prefers-color-scheme: dark) {

      --ink:#eef2f6; --ink-2:#a4b0bd; --ink-3:#75828f;
      --accent:#5d9bec; --accent-soft:#1d2b3e;
      --good:#4cbb87; --good-soft:#16291f;
      --warn:#d79a3a; --warn-soft:#2e2617;
      --crit:#e8736e; --crit-soft:#33201f;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s1-ink:#06121e; --s2-ink:#fff; --s3-ink:#041a12; --s4-ink:#1d1300;
      --dim:#59636e;
      --q1:#12325c; --q2:#17406f; --q3:#1d5087; --q4:#25639f;
      --q5:#3079bd; --q6:#4a91d5; --q7:#74afe6; --q8:#a6cdf4;
      --q-empty:#22272d;
      --dn3:#74afe6; --dn2:#3079bd; --dn1:#1d5087;
      --mid:#383835;
      --up1:#5e2422; --up2:#c9403e; --up3:#e8736e;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --ground:#14171b; --panel:#1b1f24; --panel-sunk:#23282e;
    --rule:#2e343b; --rule-strong:#414a54;
    --ink:#eef2f6; --ink-2:#a4b0bd; --ink-3:#75828f;
    --accent:#5d9bec; --accent-soft:#1d2b3e;
    --good:#4cbb87; --good-soft:#16291f;
    --warn:#d79a3a; --warn-soft:#2e2617;
    --crit:#e8736e; --crit-soft:#33201f;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s1-ink:#06121e; --s2-ink:#fff; --s3-ink:#041a12; --s4-ink:#1d1300;
    --dim:#59636e;
    --q1:#12325c; --q2:#17406f; --q3:#1d5087; --q4:#25639f;
    --q5:#3079bd; --q6:#4a91d5; --q7:#74afe6; --q8:#a6cdf4;

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);

  h1,h2,h3 { margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.012em; }

  header.masthead { padding-block:40px 28px; border-bottom:1px solid var(--rule); }
  .masthead h1 { margin-top:10px; }

  .verdict-top { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:28px; padding:26px; }

  .key .sw { width:12px; height:12px; border-radius:3px; display:inline-block; border:1px solid var(--rule-strong); }
  .key .ln { width:18px; height:0; border-top-width:2px; border-top-style:solid; display:inline-block; }
  .ramp { display:flex; align-items:center; gap:3px; }

  /* 覆盖度热力图 */
  table.cov { border-collapse:separate; border-spacing:2px; min-width:640px; }
  table.cov th { font-size:11px; font-weight:500; color:var(--ink-2); padding-bottom:5px; }
  table.cov td.lab { text-align:right; padding-right:10px; font-size:12.5px; white-space:nowrap; }
  table.cov td.c div { width:34px; height:26px; border-radius:4px; text-align:center;
                       font-size:11px; line-height:26px; }

  table.grid { border-collapse:collapse; width:100%; font-size:13px; min-width:560px; }
  table.grid th, table.grid td { padding:7px 10px; text-align:right; border-bottom:1px solid var(--rule); }
  table.grid th { font-weight:500; color:var(--ink-2); font-size:12px; }
  table.grid td:first-child, table.grid th:first-child { text-align:left; }
  table.grid tbody tr:hover { background:var(--panel-sunk); }

  .badge { display:inline-block; font-size:10.5px; font-weight:600; padding:1px 6px; border-radius:4px; vertical-align:1px; }
  .badge.ok{background:var(--good-soft);color:var(--good)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .badge.bad{background:var(--crit-soft);color:var(--crit)}

  @media (max-width:760px){ .cards{ grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--rule); border-left:3px solid var(--rule-strong);
          border-radius:0 8px 8px 0; padding:13px 15px; }
  .card.stop{border-left-color:var(--crit)} .card.check{border-left-color:var(--warn)}
  .card.fyi{border-left-color:var(--accent)} .card.ok{border-left-color:var(--good)}
  .card p { margin-top:5px; font-size:13px; color:var(--ink-2); }

  #tip { position:fixed; z-index:90; pointer-events:none; opacity:0; transition:opacity .1s;

  #tip .t-r { display:flex; justify-content:space-between; gap:14px; }

  footer { padding-block:28px 8px; font-size:12px; color:var(--ink-3); }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

<div class="wrap">
  <header class="masthead">
    <div class="eyebrow">奥克兰 CBD · 小时级价格动态</div>
    <h1 id="h1">几点订更便宜？</h1>
    <p class="lede" id="lede"></p>
    <div class="provenance" id="prov"></div>
  </header>

  <section>
    <div class="sec-head"><h2>答案</h2><span class="finer">CLAUDE.md 里悬了好几天的那个问题</span></div>

    <div class="kpis" id="kpis"></div>
  </section>

  <section>
    <div class="sec-head"><h2>关键证据：各天的小时曲线对不上</h2><span class="finer">云端 DIDA + 零售，全部成对一致性检验</span></div>
    <p class="sec-note fine" id="repro-note"></p>
    <div class="chartbox"><svg class="chart" id="reprochart" role="img" aria-labelledby="rc-t"><title id="rc-t">各观测日的小时剖面对比，以及中位数曲线</title></svg></div>
    <div class="legend" id="repro-legend"></div>

  <section>
    <div class="sec-head"><h2>每条序列的实际走势</h2><span class="finer">43 条（酒店 × 入住日），15 分钟一个点</span></div>
    <p class="sec-note fine" id="series-note"></p>
    <div class="chartbox"><svg class="chart" id="serieschart" role="img" aria-labelledby="sc-t"><title id="sc-t">全部序列相对自身中位数的偏离随时间变化，大幅波动的几条着色</title></svg></div>
    <div class="legend" id="series-legend"></div>

  <section>

    <div class="chartbox"><svg class="chart" id="evchart" role="img" aria-labelledby="ev-t"><title id="ev-t">变价事件在两日时间轴上的分布，按涨跌着色</title></svg></div>

    <div class="cards" id="retail-cards"></div>

<div id="tip" role="tooltip" aria-hidden="true"></div>

<script>
const D = /*__DATA__*/{};
const C = D.cloud, R = D.retail, M = D.meta;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pc  = v => (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
const SHORT = {
  "Ascotia Off Queen Auckland":"Ascotia Off Queen","ibis budget Auckland Central":"ibis budget",
  "Albion Hotel Auckland":"Albion","Shakespeare Hotel Auckland":"Shakespeare",
  "VR Queen Street Auckland":"VR Queen St","Auckland City Hotel":"Auckland City",
  "VR Auckland City":"VR Auckland City","The Quadrant Hotel & Suites Auckland":"Quadrant",
  "Copthorne Hotel Auckland City":"Copthorne","Abstract Hotel":"Abstract",
  "Edit Auckland Central":"Edit Central",
};
const short = h => SHORT[h] || h;
const md = d => (+d.slice(5,7)) + "/" + (+d.slice(8,10));

/* ---------------------------------------------------------------- 页头 */
document.getElementById("lede").textContent =
  `云端采集器 15 分钟一轮，到现在 ${C.rounds} 轮，把 NZ 当地时间 0–23 点全盖住了。` +
  `这是第一次有足够覆盖来检验「几点订更便宜」—— 检验的做法是看同一个小时在不同日子里对不对得上。`;

document.getElementById("prov").innerHTML = [
  ["观测窗口", `${C.first} → ${C.last} NZ`],
  ["轮次", `${C.rounds}（15 分钟一轮）`],
  ["序列", `${C.n_series} 条 = 酒店 × 入住日`],
  ["零售对照", R.snapshot || "无"],
].map(([k,v]) => `<span><b>${k}</b> ${esc(v)}</span>`).join("");

/* ---------------------------------------------------------------- 结论 */
const rep = C.repro[0];
const hourRange = rep ? Math.max(rep.range_a, rep.range_b) : 0;

/* 所有成对检验(云端 + 零售)。单看一组 r 容易被当成信号, 放在一起才看得出
   符号是随机的 —— 这是"没有钟点规律"最硬的那条证据。 */
const ALLPAIRS = [
  ...C.repro.map(r => ({ ...r, src: "云端" })),
  ...(R.repro || []).map(r => ({ ...r, src: "零售" })),
].filter(r => r.r !== null);
const nPos = ALLPAIRS.filter(r => r.r > 0).length;
const nNeg = ALLPAIRS.filter(r => r.r < 0).length;
/* 两天都有数据、因而可对照的小时 */
const CMP_HOURS = [...new Set(C.repro.flatMap(r => r.hours))].sort((a, b) => a - b);
const CELLS = Object.keys(C.hour).length + Object.keys(R.hour).length;

document.getElementById("verdict").innerHTML = `
  <div class="verdict-top">
    <div>
      <div class="eyebrow">几点订更便宜</div>
      <h2>没有「更便宜的钟点」。别为此熬夜。</h2>
      <p class="why">
        把每条序列除以它自己的中位数再按小时聚合，<b>中位数在${C.median_all_zero ? "每一个" : "几乎每一个"}小时上都是 0.0%</b>
        （云端 ${Object.keys(C.hour).length} 个格子、零售 ${Object.keys(R.hour).length} 个格子${C.median_all_zero && R.median_all_zero ? "，无一例外" : ""}）——
        也就是说，典型的那一格在一天之内<b>根本不动</b>。
        少数序列确实在动，但它们动的<b>时刻在不同日子之间对不上</b>。
        把每两天在共同覆盖的小时上做相关，一共 ${ALLPAIRS.length} 组
        （云端 ${C.repro.length} 组、零售 ${(R.repro || []).length} 组）：
        <b>${ALLPAIRS.map(r => (r.r > 0 ? "+" : "") + r.r.toFixed(2)).join("、")}</b> ——
        ${nPos} 正 ${nNeg} 负，<b>符号跟掷硬币一样</b>。
        真有钟点规律的话，这些数该一致为正才对。
        按项目自己的判据 —— 两天对不上就说明看到的是当天的偶然波动、不是时段规律 ——
        <b>这条结论不成立</b>。
      </p>
    </div>
    <div class="vside">
      <div class="bignum"><span class="val num">0.0</span><span class="u">%</span></div>
      <div class="finer" style="margin-top:4px">典型序列的小时波动（中位数，${CELLS} 个「日期×小时」格子无一例外）</div>
      <div style="margin-top:14px">
        <div class="kv"><span class="k">一分钱没动的序列</span><span class="v num">${C.flat} / ${C.n_series}</span></div>
        <div class="kv"><span class="k">成对一致性检验</span><span class="v num">${nPos} 正 / ${nNeg} 负</span></div>
        <div class="kv"><span class="k">观测天数（云端／零售）</span><span class="v num">${C.days.length} / ${R.days.length}</span></div>
        <div class="kv"><span class="k">可对照的小时</span><span class="v num">${CMP_HOURS.length} 个</span></div>
      </div>
    </div>
  </div>`;

document.getElementById("kpis").innerHTML = [
  ["价格多久动一次", C.gap_median + " 小时", `四分位 ${C.gap_q1}–${C.gap_q3} 小时`],
  ["变价事件总数", C.events.length, `${C.n_series} 条序列，${C.rounds} 轮`],
  ["同一天内最大波动", C.within_median + "%", "中位数，相对自身"],
  ["整段没动过", C.flat + " 条", `占 ${(100*C.flat/C.n_series).toFixed(0)}%`],
].map(([k,v,s]) => `<div class="kpi"><div class="k">${esc(k)}</div><div class="v num">${v}</div><div class="s">${esc(s)}</div></div>`).join("");

/* ---------------------------------------------------------------- tooltip */
const tip = document.getElementById("tip");
function showTip(html, ev, el) {
  tip.innerHTML = html; tip.classList.add("on"); tip.setAttribute("aria-hidden","false");
  const tr = tip.getBoundingClientRect();
  const r = el ? el.getBoundingClientRect() : {left:ev.clientX, top:ev.clientY, bottom:ev.clientY, width:0};
  let x = (ev ? ev.clientX : r.left) + 14, y = r.top - tr.height - 8;
  if (x + tr.width > innerWidth - 8) x = innerWidth - tr.width - 8;
  if (y < 8) y = (r.bottom || ev.clientY) + 8;
  tip.style.left = Math.max(8,x) + "px"; tip.style.top = y + "px";
}
function hideTip(){ tip.classList.remove("on"); tip.setAttribute("aria-hidden","true"); }

/* ---------------------------------------------------------------- 小时剖面 */
const DAYCOL = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)"];
(function reproChart(){
  const W=880,H=300,L=52,Rr=46,T=20,B=44, iw=W-L-Rr, ih=H-T-B;
  const days = C.days;
  const get = (d,h,f) => { const c = C.hour[`${d}|${h}`]; return c ? c[f] : null; };
  const all = [];
  days.forEach(d => { for(let h=0;h<24;h++){ const v=get(d,h,"mean"); if(v!==null) all.push(v); } });
  const lo = Math.min(...all,0), hi = Math.max(...all,0);
  const pad = Math.max(1,(hi-lo)*0.15);
  const ymin = Math.floor((lo-pad)*2)/2, ymax = Math.ceil((hi+pad)*2)/2;
  const X = h => L + h*iw/23;
  const Y = v => T + ih - (v-ymin)/(ymax-ymin)*ih;

  let s = "";
  const step = (ymax-ymin) <= 3 ? 0.5 : 1;
  for (let v=Math.ceil(ymin/step)*step; v<=ymax+1e-9; v+=step) {
    const zero = Math.abs(v) < 1e-9;
    s += `<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${L+iw}" y2="${Y(v).toFixed(1)}" stroke="${zero?"var(--rule-strong)":"var(--rule)"}" stroke-width="1"/>`
       + `<text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ink-3)">${v>0?"+":""}${v.toFixed(1)}</text>`;
  }
  // 两天都有数据的小时: 底色标出来, 这几个小时才是可检验的
  CMP_HOURS.forEach(h => {
    s += `<rect x="${(X(h)-iw/46).toFixed(1)}" y="${T}" width="${(iw/23).toFixed(1)}" height="${ih}" fill="var(--accent)" opacity=".07"/>`;
  });
  for (let h=0;h<24;h+=2) {
    s += `<text x="${X(h).toFixed(1)}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${h}</text>`;
  }
  s += `<text x="${L+iw/2}" y="${H-B+34}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)">NZ 当地时间（小时）</text>`;

  days.forEach((d,k) => {
    const pts=[]; for(let h=0;h<24;h++){ const v=get(d,h,"mean"); if(v!==null) pts.push([h,v]); }
    // 断档处不连线
    let path="", prevH=null;
    pts.forEach(([h,v]) => { path += (prevH===null||h-prevH>1 ? "M":"L") + X(h).toFixed(1) + " " + Y(v).toFixed(1) + " "; prevH=h; });
    s += `<path d="${path}" fill="none" stroke="${DAYCOL[k % DAYCOL.length]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(([h,v]) => {
      s += `<circle class="hp" cx="${X(h).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="${DAYCOL[k % DAYCOL.length]}" stroke="var(--panel)" stroke-width="2" data-d="${d}" data-h="${h}"/>`;
    });
    const last = pts[pts.length-1];
    s += `<text x="${(X(last[0])+8).toFixed(1)}" y="${(Y(last[1])+4).toFixed(1)}" font-size="10.5" fill="var(--ink-2)">${md(d)}</text>`;
  });
  // 中位数: 恒为 0
  s += `<line x1="${L}" y1="${Y(0).toFixed(1)}" x2="${L+iw}" y2="${Y(0).toFixed(1)}" stroke="var(--dim)" stroke-width="2" stroke-dasharray="1 4" stroke-linecap="round"/>`;
  s += `<text x="${L+6}" y="${(Y(0)-7).toFixed(1)}" font-size="10" fill="var(--ink-3)">中位数：${Object.keys(C.hour).length} 个格子全部 0.0%</text>`;

  const sv=document.getElementById("reprochart");
  sv.setAttribute("viewBox",`0 0 ${W} ${H}`); sv.insertAdjacentHTML("beforeend",s);
  sv.addEventListener("mouseover", e => {
    const el=e.target.closest(".hp"); if(!el) return;
    const c=C.hour[`${el.dataset.d}|${el.dataset.h}`];
    showTip(`<div class="t-h">${md(el.dataset.d)} ${el.dataset.h}:00 NZ</div>`+
            `<div class="t-d">${c.n} 个读数</div>`+
            `<div class="t-r"><span>均值偏离</span><span class="num">${pc(c.mean)}</span></div>`+
            `<div class="t-r"><span>中位数偏离</span><span class="num">${pc(c.median)}</span></div>`, e, el);
  });
  sv.addEventListener("mouseout", e => { if(e.target.closest(".hp")) hideTip(); });
})();

document.getElementById("repro-note").innerHTML =

const MOVERS = C.series.filter(s=>s.big).sort((a,b)=>b.spread_pct-a.spread_pct).slice(0,4);
const MCOL = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)"];
(function seriesChart(){
  const W=880,H=330,L=52,Rr=18,T=18,B=46, iw=W-L-Rr, ih=H-T-B;
  const n = C.times.length;
  const rel = s => s.v.map(v => v===null ? null : 100*(v-s.median)/s.median);
  const allv = C.series.flatMap(s=>rel(s)).filter(v=>v!==null);
  const lo=Math.min(...allv), hi=Math.max(...allv);
  const ymin=Math.floor(lo/5)*5, ymax=Math.ceil(hi/5)*5;
  const X = i => L + (n<2?0:i*iw/(n-1));
  const Y = v => T + ih - (v-ymin)/(ymax-ymin)*ih;
  const path = r => { let d="",pen=false;
    r.forEach((v,i)=>{ if(v===null){pen=false;return;} d += (pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)+" "; pen=true; });
    return d; };

  let s="";
  for(let v=Math.ceil(ymin/5)*5; v<=ymax; v+=5){
    const zero=v===0;
    s += `<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${L+iw}" y2="${Y(v).toFixed(1)}" stroke="${zero?"var(--rule-strong)":"var(--rule)"}" stroke-width="1"/>`
       + `<text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ink-3)">${v>0?"+":""}${v}%</text>`;
  }
  // 日界线
  C.times.forEach((t,i)=>{ if(t.nz.slice(11)==="00:00"){
    s += `<line x1="${X(i).toFixed(1)}" y1="${T}" x2="${X(i).toFixed(1)}" y2="${T+ih}" stroke="var(--rule-strong)" stroke-width="1"/>`
       + `<text x="${(X(i)+5).toFixed(1)}" y="${T+12}" font-size="10" fill="var(--ink-3)">${t.nz.slice(5,10)} 00:00</text>`;
  }});
  // 时间轴刻度: 每 4 小时
  let lastLab=-99;
  C.times.forEach((t,i)=>{ const hh=+t.nz.slice(11,13), mm=+t.nz.slice(14,16);
    if(mm===0 && hh%6===0 && i-lastLab>4){ lastLab=i;
      s += `<text x="${X(i).toFixed(1)}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${String(hh).padStart(2,"0")}:00</text>`;
    }});
  s += `<text x="${L+iw/2}" y="${H-B+34}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)">NZ 当地时间</text>`;

  C.series.filter(x=>!MOVERS.includes(x)).forEach(x=>{
    s += `<path d="${path(rel(x))}" fill="none" stroke="var(--dim)" stroke-width="1.1" opacity=".5"/>`;
  });
  MOVERS.forEach((x,k)=>{
    s += `<path d="${path(rel(x))}" fill="none" stroke="${MCOL[k]}" stroke-width="2" stroke-linejoin="round"/>`;
  });
  const sv=document.getElementById("serieschart");
  sv.setAttribute("viewBox",`0 0 ${W} ${H}`); sv.insertAdjacentHTML("beforeend",s);
})();

(function evChart(){
  const W=880,H=210,L=52,Rr=18,T=22,B=44, iw=W-L-Rr, ih=H-T-B;
  const t0=new Date(C.times[0].utc+"Z").getTime(), t1=new Date(C.times[C.times.length-1].utc+"Z").getTime();
  const X = ms => L + (ms-t0)/(t1-t0)*iw;
  const mags = C.events.map(e=>Math.abs(e.d/ (e.from||1) *100));
  const maxMag = Math.max(...mags, 1);
  const Y = m => T + ih - Math.min(m/maxMag,1)*ih;

  let s="";
  [0,.25,.5,.75,1].forEach(f=>{
    const v=f*maxMag;
    s += `<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${L+iw}" y2="${Y(v).toFixed(1)}" stroke="var(--rule)" stroke-width="1"/>`
       + `<text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ink-3)">${v.toFixed(0)}%</text>`;
  });
  C.times.forEach(t=>{ if(t.nz.slice(11)==="00:00"){
    const ms=new Date(t.utc+"Z").getTime();
    s += `<line x1="${X(ms).toFixed(1)}" y1="${T}" x2="${X(ms).toFixed(1)}" y2="${T+ih}" stroke="var(--rule-strong)" stroke-width="1"/>`
       + `<text x="${(X(ms)+5).toFixed(1)}" y="${T+11}" font-size="10" fill="var(--ink-3)">${t.nz.slice(5,10)} 00:00</text>`;
  }});
  let lastLab=-1e9;
  C.times.forEach(t=>{ const hh=+t.nz.slice(11,13), mm=+t.nz.slice(14,16);
    const ms=new Date(t.utc+"Z").getTime();
    if(mm===0 && hh%6===0 && X(ms)-lastLab>60){ lastLab=X(ms);
      s += `<text x="${X(ms).toFixed(1)}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${String(hh).padStart(2,"0")}:00</text>`;
    }});
  s += `<text x="${L+iw/2}" y="${H-B+34}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)">NZ 当地时间</text>`;

  C.events.forEach((e,i)=>{
    const mag=Math.abs(e.d/(e.from||1)*100);
    const up=e.d>0;
    const col = mag>10 ? (up?"var(--up3)":"var(--dn3)") : mag>3 ? (up?"var(--up2)":"var(--dn2)") : (up?"var(--up1)":"var(--dn1)");
    const ms=new Date(e.at+"Z").getTime();
    s += `<circle class="ev" cx="${X(ms).toFixed(1)}" cy="${Y(mag).toFixed(1)}" r="4.5" fill="${col}" stroke="var(--panel)" stroke-width="1.5" data-i="${i}"/>`;
  });
  const sv=document.getElementById("evchart");
  sv.setAttribute("viewBox",`0 0 ${W} ${H}`); sv.insertAdjacentHTML("beforeend",s);
  sv.addEventListener("mouseover", ev => {
    const el=ev.target.closest(".ev"); if(!el) return;
    const e=C.events[+el.dataset.i];
    showTip(`<div class="t-h">${esc(short(e.hotel))}</div>`+
            `<div class="t-d">入住 ${md(e.checkin)} · 变于 ${e.nz} NZ</div>`+

            `<div class="t-r"><span>幅度</span><span class="num">${e.d>0?"+":""}${(e.d/e.from*100).toFixed(1)}%</span></div>`, ev, el);
  });
  sv.addEventListener("mouseout", ev => { if(ev.target.closest(".ev")) hideTip(); });
})();

/* ---------------------------------------------------------------- 覆盖度 */
function covTable(el, days, hourTbl, title, unit) {
  const counts=[];
  days.forEach(d => { for(let h=0;h<24;h++){ const c=hourTbl[`${d}|${h}`]; if(c) counts.push(c.n); } });
  const mx=Math.max(...counts,1);
  const q = n => { const f=n/mx; return f>.875?8:f>.75?7:f>.625?6:f>.5?5:f>.375?4:f>.25?3:f>.125?2:1; };
  let html = `<thead><tr><th colspan="25" style="text-align:left;font-size:13px;color:var(--ink);padding-bottom:8px">${title}</th></tr>`;
  html += `<tr><th></th>` + Array.from({length:24},(_,h)=>`<th>${h}</th>`).join("") + `</tr></thead><tbody>`;
  days.forEach(d => {
    html += `<tr><td class="lab">${md(d)}</td>`;
    for(let h=0;h<24;h++){
      const c=hourTbl[`${d}|${h}`];
      html += `<td class="c"><div style="background:${c?`var(--q${q(c.n)})`:"var(--q-empty)"};color:${c&&q(c.n)>=5?"#fff":"var(--ink-2)"}" title="${c?`${c.n} 个读数`:"无数据"}">${c?c.n:""}</div></td>`;
    }
    html += `</tr>`;
  });
  document.getElementById(el).innerHTML = html + `</tbody>`;
  return mx;
}
